name: Build launcher APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip uploaded archive (if any)
        run: |
          for z in *.zip; do
            [ -f "$z" ] && unzip -q -o "$z" -d src_unzipped
          done
          true

      - name: Find launcher folder
        id: find
        run: |
          GRADLEW=$(find . -path '*/launcher/gradlew' | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "launcher/gradlew not found. Folders in repo:"
            find . -maxdepth 4 -type d -not -path './.git*' | head -50
            exit 1
          fi
          DIR=$(dirname "$GRADLEW")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Launcher folder: $DIR"

      - name: Build release APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/release/*.apk